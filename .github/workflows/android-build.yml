
name: Android Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: unzip -q Mic-router-lite-main.zip

      - name: Build APK
        run: |
          cd Mic-router-lite-main
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: mic-router-lite-debug
          path: Mic-router-lite-main/app/build/outputs/apk/debug/app-debug.apk
